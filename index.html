<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 Player Ludo</title>
<style>
:root{--red:#e53935;--yellow:#fbc02d;--ink:#202124;--paper:#f5f6f8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,sans-serif;color:var(--ink);text-align:center}
header{background:#172554;color:white;padding:14px}h1{font-size:23px;margin:0}
main{max-width:760px;margin:auto;padding:12px}
.panel{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:12px 0}
.player{padding:8px 14px;border-radius:10px;background:white;border:2px solid #ddd;font-weight:bold}
.player.active{border-color:#111;box-shadow:0 0 0 2px #cbd5e1}
#message{min-height:42px;font-weight:bold;padding:8px}
#board{width:min(94vw,620px);aspect-ratio:1;margin:10px auto;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);border:3px solid #202124;background:white}
.cell{border:1px solid #d5d8df;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.blank{background:#fff}.red-home{background:#ffcdd2}.yellow-home{background:#fff1a8}
.center{background:conic-gradient(var(--yellow) 0 25%,#fff 0 50%,var(--red) 0 75%,#fff 0)}
.track{background:#fff}.safe{background:#e8edf5}
.lane-red{background:#ef9a9a}.lane-yellow{background:#ffe082}
.yard{position:absolute;width:72%;height:72%;border-radius:50%;border:2px solid #333;display:flex;align-items:center;justify-content:center;font-size:clamp(8px,2vw,14px);font-weight:bold;cursor:pointer;padding:0}
.yard.red-token{background:var(--red);color:white}.yard.yellow-token{background:var(--yellow);color:#222}
.token-stack{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1px;width:100%;height:100%}
.token{border:1.5px solid #222;border-radius:50%;width:85%;height:85%;font-weight:bold;cursor:pointer;padding:0;font-size:clamp(7px,1.8vw,12px)}
.token.red-token{background:var(--red);color:white}.token.yellow-token{background:var(--yellow);color:#222}
.token:disabled{cursor:default;opacity:1}.token.movable{outline:2px solid #111;outline-offset:-2px}
button.action{border:0;border-radius:9px;background:#172554;color:white;padding:12px 20px;font-size:16px;font-weight:bold}
button.action:disabled{opacity:.4}
#dice{font-size:36px;min-width:48px}
.note{font-size:12px;color:#555;line-height:1.5;max-width:620px;margin:14px auto}
</style>
</head>
<body>
<header><h1>2 Player Ludo</h1></header>
<main>
<div class="panel">
 <div id="redPlayer" class="player active">🔴 लाल खिलाड़ी</div>
 <div id="yellowPlayer" class="player">🟡 पीला खिलाड़ी</div>
</div>
<div id="message">लाल खिलाड़ी की बारी। पासा फेंकें।</div>
<div class="panel">
 <button id="roll" class="action">पासा फेंको</button>
 <span id="dice">🎲</span>
 <button id="restart" class="action">नया गेम</button>
</div>
<div id="board" aria-label="दो खिलाड़ियों का लूडो बोर्ड"></div>
<p class="note">दो खिलाड़ी, हर खिलाड़ी की 4 गोटियाँ। 6 आने पर गोटी बाहर आती है। अपनी चमकती गोटी चुनें। सुरक्षित खाने पर गोटी नहीं कटती। चारों गोटियाँ घर पहुँचाने वाला खिलाड़ी जीतता है।</p>
</main>
<script src="game.js"></script>
</body>
</html>
